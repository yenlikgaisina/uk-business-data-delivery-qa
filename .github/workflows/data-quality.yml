name: Data quality gate

# Runs the full delivery pipeline against the committed real Companies House
# and ONS extracts, then runs the automated QA suite. A failing check here is
# the same gate that blocks a client delivery in docs/delivery_runbook.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest source extracts
        run: python src/ingest.py

      - name: Transform, enrich and reconcile
        run: python src/transform.py

      - name: Run data quality gate
        run: pytest tests/test_data_quality.py -v

      - name: Generate QA sign-off report
        run: python src/validate.py

      - name: Export validated client delivery
        run: python src/export_delivery.py

      - name: Upload QA report and delivery
        uses: actions/upload-artifact@v4
        with:
          name: delivery-and-qa-report
          path: |
            outputs/qa_report.md
            outputs/reconciliation_report.csv
            data/sample/client_delivery_sample.csv
          if-no-files-found: error
